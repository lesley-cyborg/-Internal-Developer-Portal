version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devpulse_postgres
    environment:
      POSTGRES_USER: devpulse_user
      POSTGRES_PASSWORD: devpulse_password
      POSTGRES_DB: devpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse_user -d devpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: